name: Alpha release

on:
  push:
    tags:
      - v1.0.0-alpha

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt -r requirements-yara.txt
      - name: Verify version and run tests
        shell: pwsh
        run: |
          python -c "from ironwall import __version__; assert __version__ == '1.0.0-alpha'"
          if ($LASTEXITCODE -ne 0) { throw "Release version does not match the tag" }
          python -m pytest tests -q
          if ($LASTEXITCODE -ne 0) { throw "Release tests failed" }
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build and smoke-test Windows EXE
        shell: pwsh
        run: ./scripts/build_windows.ps1
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Publish Alpha prerelease
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME ./dist/IronWall-Antivirus.exe --verify-tag --title "Alpha v1.0.0" --notes-file RELEASE_NOTES.md --prerelease
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the Alpha release" }
        env:
          GH_TOKEN: ${{ github.token }}
