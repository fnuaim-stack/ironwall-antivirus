name: Windows CI
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -r requirements-yara.txt
      - run: python -m compileall ironwall
      - run: python -m ruff check ironwall tests
      - run: python -m pytest tests -q
        env:
          QT_QPA_PLATFORM: offscreen

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r requirements.txt -r requirements-yara.txt
      - name: Build and smoke-test packaged application
        shell: pwsh
        run: ./scripts/build_windows.ps1
        env:
          QT_QPA_PLATFORM: offscreen
      - uses: actions/upload-artifact@v4
        with:
          name: IronWall-Antivirus-Windows
          path: dist/IronWall-Antivirus.exe
          if-no-files-found: error
          retention-days: 14
